global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:9000"]
  # vLLM работает на хосте отдельно от compose, порт 8000.
  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
