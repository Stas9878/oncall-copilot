global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9000"]
  # vLLM слушает порт 8000 на хосте: запущен отдельно или профилем local-llm
  # этого compose.
  - job_name: vllm
    static_configs:
      - targets: ["host.docker.internal:8000"]
