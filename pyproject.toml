[project]
name = "oncall-copilot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "natasha>=1.6.0",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: нужны Postgres, Redis и Qdrant из docker compose"]
filterwarnings = ["ignore::DeprecationWarning"]
