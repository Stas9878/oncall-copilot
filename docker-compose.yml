# Инфраструктура сервиса: docker compose up -d
# Порты на хосте меняются переменными *_HOST_PORT, если стандартные заняты.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8.8.3-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  postgres:
  qdrant:
